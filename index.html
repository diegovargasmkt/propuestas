<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propuestas — Diego Vargas</title>
<style>
  :root {
    --azul-profundo: #0A2E4D;
    --azul-medio: #1B5E8C;
    --arena: #E8E4DC;
    --texto: #1a1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--arena);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--azul-profundo);
    color: white;
    padding: 3rem 2rem;
    text-align: center;
  }
  header h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }
  header p {
    font-size: 1.1rem;
    opacity: 0.85;
    font-weight: 300;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 3rem 2rem;
    flex: 1;
    width: 100%;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 2rem;
    box-shadow: 0 2px 12px rgba(10, 46, 77, 0.08);
    border-left: 4px solid var(--azul-medio);
    transition: transform 0.2s, box-shadow 0.2s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(10, 46, 77, 0.15);
  }
  .card h2 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.3rem;
    color: var(--azul-profundo);
    margin-bottom: 0.5rem;
  }
  .card p {
    font-size: 0.95rem;
    color: #555;
    line-height: 1.5;
  }
  .card .tag {
    display: inline-block;
    background: var(--azul-medio);
    color: white;
    font-size: 0.75rem;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    margin-bottom: 1rem;
    font-weight: 500;
  }
  footer {
    background: var(--azul-profundo);
    color: white;
    text-align: center;
    padding: 1.5rem;
    font-size: 0.85rem;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <header>
    <h1>Propuestas</h1>
    <p>Estrategias de comunicación y presentaciones ejecutivas</p>
  </header>
  <main>
    <div class="grid">
      <a href="aunap-alvarado/index.html" class="card">
        <span class="tag">AUNAP · 2026</span>
        <h2>AUNAP — Juan Rodrigo Alvarado</h2>
        <p>Visión estratégica de comunicaciones para la Autoridad Nacional de Acuicultura y Pesca y su director.</p>
      </a>
    </div>
  </main>
  <footer>
    Diego Vargas · Propuestas públicas
  </footer>
</body>
</html>
